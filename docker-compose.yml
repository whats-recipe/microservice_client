version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db_user_service
    environment:
      POSTGRES_USER: user_database_recipe
      POSTGRES_PASSWORD: user_database_1975
      POSTGRES_DB: database_user
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    restart:  unless-stopped
volumes:
  db_data: